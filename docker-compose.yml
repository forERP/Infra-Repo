services:
  mysql:
    image: mysql:8.0
    container_name: forerp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: forerp
      MYSQL_USER: forerp
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - forerp-net

  backend:
    image: ghcr.io/forerp/backend-repo:dev
    container_name: forerp-backend
    restart: unless-stopped
    depends_on:
      - mysql
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/forerp
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
    ports:
      - "8089:8089"
    networks:
      - forerp-net

  backoffice-web:
    image: ghcr.io/forerp/frontend-repo/backoffice-web:dev
    container_name: forerp-backoffice-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3100:80"
    networks:
      - forerp-net

  store-web:
    image: ghcr.io/forerp/frontend-repo/store-web:dev
    container_name: forerp-store-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3200:80"
    networks:
      - forerp-net

networks:
  forerp-net:
    driver: bridge

volumes:
  mysql-data:
    driver: local
